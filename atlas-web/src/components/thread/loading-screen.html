<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas — Loading</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root { --color-text-secondary: rgba(255, 255, 255, 0.55); }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
}

/* For standalone preview only — remove when embedding */
body { background: #0a0d18; }

#root { position: relative; width: 100%; height: 100%; }

#scene { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ── Loading UI ─────────────────────────────── */

.loading-ui {
  position: absolute;
  bottom: 28%;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  white-space: nowrap;
  opacity: 0;
  animation: uiReveal 0.9s 1s cubic-bezier(0.33, 1, 0.68, 1) forwards;
}

@keyframes uiReveal {
  from { opacity: 0; transform: translateX(-50%) translateY(8px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}

.loading-primary {
  font-size: 15px;
  color: var(--color-text-secondary);
  font-weight: 500;
  letter-spacing: 0.02em;
  margin-bottom: 10px;
}

/* ── Status cycling ─────────────────────────── */

.status-wrap {
  position: relative;
  height: 17px;
  margin-bottom: 20px;
}

.status-msg {
  position: absolute;
  left: 50%;
  top: 0;
  transform: translateX(-50%);
  font-size: 10.5px;
  color: var(--color-text-secondary);
  opacity: 0;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  font-weight: 400;
}

/* 10 s total: 4 × 2.5 s slots, staggered by 2.5 s each */
.s1 { animation: msgCycle 10s 1.2s  infinite; }
.s2 { animation: msgCycle 10s 3.7s  infinite; }
.s3 { animation: msgCycle 10s 6.2s  infinite; }
.s4 { animation: msgCycle 10s 8.7s  infinite; }

@keyframes msgCycle {
  0%   { opacity: 0; transform: translateX(-50%) translateY(5px); }
  8%   { opacity: 0.6; transform: translateX(-50%) translateY(0); }
  19%  { opacity: 0.6; transform: translateX(-50%) translateY(0); }
  25%  { opacity: 0; transform: translateX(-50%) translateY(-5px); }
  100% { opacity: 0; transform: translateX(-50%) translateY(-5px); }
}

/* ── Waypoint indicator ─────────────────────── */

.waypoints {
  display: flex;
  align-items: center;
  justify-content: center;
}

.wp {
  width: 7px; height: 7px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.22);
  background: transparent;
  flex-shrink: 0;
}

.wp-dash {
  width: 20px; height: 1px;
  background: rgba(255, 255, 255, 0.10);
  flex-shrink: 0;
}

.wp1 { animation: wpGlow 2.1s 0s    ease-in-out infinite; }
.wp2 { animation: wpGlow 2.1s 0.7s  ease-in-out infinite; }
.wp3 { animation: wpGlow 2.1s 1.4s  ease-in-out infinite; }

@keyframes wpGlow {
  0%, 100% {
    border-color: rgba(255, 255, 255, 0.18);
    box-shadow: none;
    background: transparent;
  }
  50% {
    border-color: rgba(255, 255, 255, 0.88);
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.06),
                0 0 10px 2px rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.08);
  }
}
</style>
</head>
<body>
<div id="root">

<!-- ════════════════════════════════════════════
     SVG SCENE
════════════════════════════════════════════ -->
<svg id="scene"
     viewBox="0 0 1200 700"
     preserveAspectRatio="xMidYMid slice"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- ── Flight path (bottom-left → top-right arc) ── -->
    <path id="fp"
          d="M -95,572 C 80,505 270,335 595,258 C 845,196 1060,188 1315,150"/>

    <!-- ── Soft glow for markers ── -->
    <filter id="mk" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ══ WORLD GRID ══════════════════════════════════════════════ -->
  <!-- Barely-visible latitude / longitude arcs; fade in at 0.8 s -->
  <g>
    <animate attributeName="opacity" from="0" to="0.055"
             dur="1.2s" begin="0.8s" fill="freeze"/>

    <!-- Longitude curves (slightly bowed) -->
    <path d="M 200,-8 Q 185,348 212,708"  stroke="white" stroke-width="0.65" fill="none"/>
    <path d="M 400,-8 Q 387,348 404,708"  stroke="white" stroke-width="0.65" fill="none"/>
    <path d="M 600,-8 Q 594,348 598,708"  stroke="white" stroke-width="0.65" fill="none"/>
    <path d="M 800,-8 Q 797,348 796,708"  stroke="white" stroke-width="0.65" fill="none"/>
    <path d="M 1000,-8 Q 1003,348 999,708" stroke="white" stroke-width="0.65" fill="none"/>

    <!-- Latitude curves -->
    <path d="M -8,175 Q 600,162 1208,175"  stroke="white" stroke-width="0.65" fill="none"/>
    <path d="M -8,350 Q 600,337 1208,350"  stroke="white" stroke-width="0.65" fill="none"/>
    <path d="M -8,525 Q 600,512 1208,525"  stroke="white" stroke-width="0.65" fill="none"/>
  </g>

  <!-- ══ ALTITUDE STREAMS ════════════════════════════════════════ -->
  <!-- Very faint long wavy lines drifting leftward -->
  <g opacity="0.032">
    <path d="M -250,188 C 150,180 620,196 1040,184 S 1500,176 1850,190"
          stroke="white" stroke-width="1.2" fill="none">
      <animateTransform attributeName="transform" type="translate"
                        from="0,0" to="-320,0" dur="19s" repeatCount="indefinite"/>
    </path>
    <path d="M -180,294 C 220,284 680,300 1100,288 S 1560,280 1880,296"
          stroke="white" stroke-width="0.9" fill="none">
      <animateTransform attributeName="transform" type="translate"
                        from="0,0" to="-320,0" dur="25s" repeatCount="indefinite"/>
    </path>
    <path d="M -120,398 C 320,387 780,404 1200,392 S 1640,383 1960,400"
          stroke="white" stroke-width="1.0" fill="none">
      <animateTransform attributeName="transform" type="translate"
                        from="0,0" to="-320,0" dur="21s" repeatCount="indefinite"/>
    </path>
    <path d="M 40,490 C 440,479 900,496 1320,484 S 1740,476 2040,492"
          stroke="white" stroke-width="0.8" fill="none">
      <animateTransform attributeName="transform" type="translate"
                        from="0,0" to="-320,0" dur="29s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ══ BACKGROUND CLOUDS  (opacity 0.06, 32 s) ════════════════ -->
  <!-- Double-wide so translateX(-1200) creates a seamless loop    -->
  <g>
    <animate attributeName="opacity" from="0" to="0.06"
             dur="1.8s" begin="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
                      from="0,0" to="-1200,0" dur="32s" repeatCount="indefinite"/>

    <!-- Set A (x 0–1200) -->
    <ellipse cx="110"  cy="208" rx="195" ry="27" fill="white"/>
    <ellipse cx="182"  cy="200" rx="122" ry="19" fill="white"/>
    <ellipse cx="575"  cy="348" rx="225" ry="29" fill="white"/>
    <ellipse cx="652"  cy="339" rx="140" ry="21" fill="white"/>
    <ellipse cx="1025" cy="165" rx="208" ry="25" fill="white"/>

    <!-- Set B (x 1200–2400, mirrors A) -->
    <ellipse cx="1310" cy="208" rx="195" ry="27" fill="white"/>
    <ellipse cx="1382" cy="200" rx="122" ry="19" fill="white"/>
    <ellipse cx="1775" cy="348" rx="225" ry="29" fill="white"/>
    <ellipse cx="1852" cy="339" rx="140" ry="21" fill="white"/>
    <ellipse cx="2225" cy="165" rx="208" ry="25" fill="white"/>
  </g>

  <!-- ══ MID CLOUDS  (opacity 0.10, 22 s) ══════════════════════ -->
  <g>
    <animate attributeName="opacity" from="0" to="0.10"
             dur="1.8s" begin="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
                      from="0,0" to="-1200,0" dur="22s" repeatCount="indefinite"/>

    <ellipse cx="318"  cy="458" rx="172" ry="21" fill="white"/>
    <ellipse cx="388"  cy="450" rx="108" ry="15" fill="white"/>
    <ellipse cx="808"  cy="118" rx="185" ry="23" fill="white"/>
    <ellipse cx="1182" cy="518" rx="157" ry="19" fill="white"/>

    <ellipse cx="1518" cy="458" rx="172" ry="21" fill="white"/>
    <ellipse cx="1588" cy="450" rx="108" ry="15" fill="white"/>
    <ellipse cx="2008" cy="118" rx="185" ry="23" fill="white"/>
    <ellipse cx="2382" cy="518" rx="157" ry="19" fill="white"/>
  </g>

  <!-- ══ FOREGROUND CLOUDS  (opacity 0.14, 14 s) ════════════════ -->
  <g>
    <animate attributeName="opacity" from="0" to="0.14"
             dur="1.8s" begin="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
                      from="0,0" to="-1200,0" dur="14s" repeatCount="indefinite"/>

    <ellipse cx="472"  cy="574" rx="152" ry="18" fill="white"/>
    <ellipse cx="537"  cy="566" rx="92"  ry="13" fill="white"/>
    <ellipse cx="972"  cy="638" rx="168" ry="20" fill="white"/>
    <ellipse cx="1448" cy="558" rx="142" ry="17" fill="white"/>

    <ellipse cx="1672" cy="574" rx="152" ry="18" fill="white"/>
    <ellipse cx="1737" cy="566" rx="92"  ry="13" fill="white"/>
    <ellipse cx="2172" cy="638" rx="168" ry="20" fill="white"/>
    <ellipse cx="2648" cy="558" rx="142" ry="17" fill="white"/>
  </g>

  <!-- ══ FLIGHT TRAIL ═══════════════════════════════════════════ -->
  <!-- Dashed path that progressively draws then fades behind plane -->
  <path d="M -95,572 C 80,505 270,335 595,258 C 845,196 1060,188 1315,150"
        stroke="rgba(255,255,255,0.38)"
        stroke-width="1.5"
        stroke-dasharray="5,9"
        fill="none"
        stroke-linecap="round">
    <animate attributeName="stroke-dashoffset"
             values="1000;0"
             dur="5s" repeatCount="indefinite"
             calcMode="linear"/>
    <animate attributeName="opacity"
             values="0;0;0.42;0.42;0"
             keyTimes="0;0.04;0.13;0.87;1"
             dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- ══ DESTINATION MARKERS ════════════════════════════════════ -->
  <g>
    <animate attributeName="opacity" from="0" to="1"
             dur="0.9s" begin="0.8s" fill="freeze"/>

    <!-- Thin dashed connectors -->
    <line x1="272" y1="320" x2="542" y2="260"
          stroke="rgba(255,255,255,0.075)" stroke-width="0.8" stroke-dasharray="4,9"/>
    <line x1="542" y1="260" x2="808" y2="244"
          stroke="rgba(255,255,255,0.075)" stroke-width="0.8" stroke-dasharray="4,9"/>

    <!-- Marker 1 (~25 % along path) -->
    <g transform="translate(272,320)">
      <circle r="8" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="0.8">
        <animate attributeName="r"       values="7;14;7"     dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0;0.35" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle r="3" fill="white" filter="url(#mk)">
        <animate attributeName="opacity" values="0.42;1;0.42" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Marker 2 (~50 % along path) -->
    <g transform="translate(542,260)">
      <circle r="8" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="0.8">
        <animate attributeName="r"       values="7;14;7"      dur="3.5s" begin="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0;0.35"  dur="3.5s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle r="3" fill="white" filter="url(#mk)">
        <animate attributeName="opacity" values="0.42;1;0.42" dur="3.5s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Marker 3 (~75 % along path) -->
    <g transform="translate(808,244)">
      <circle r="8" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="0.8">
        <animate attributeName="r"       values="7;14;7"      dur="2.8s" begin="2.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0;0.35"  dur="2.8s" begin="2.3s" repeatCount="indefinite"/>
      </circle>
      <circle r="3" fill="white" filter="url(#mk)">
        <animate attributeName="opacity" values="0.42;1;0.42" dur="2.8s" begin="2.3s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- ══ DISTANT STARS ══════════════════════════════════════════ -->
  <circle cx="132" cy="70"  r="1"   fill="white">
    <animate attributeName="opacity" values="0.15;0.82;0.15" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="388" cy="42"  r="0.8" fill="white">
    <animate attributeName="opacity" values="0.22;0.90;0.22" dur="4.3s" begin="1.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="674" cy="78"  r="1"   fill="white">
    <animate attributeName="opacity" values="0.10;0.76;0.10" dur="2.9s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="918" cy="50"  r="0.8" fill="white">
    <animate attributeName="opacity" values="0.18;0.86;0.18" dur="4.0s" begin="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1090" cy="88" r="1"   fill="white">
    <animate attributeName="opacity" values="0.25;0.80;0.25" dur="4.7s" begin="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1168" cy="36" r="0.7" fill="white">
    <animate attributeName="opacity" values="0.18;0.68;0.18" dur="3.1s" begin="2.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52"   cy="130" r="0.8" fill="white">
    <animate attributeName="opacity" values="0.12;0.72;0.12" dur="3.8s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

  <!-- ══ AIRCRAFT ════════════════════════════════════════════════ -->
  <!--
    Local coordinate frame: +x = nose, ±y = wings.
    animateMotion rotate="auto" aligns +x with path tangent automatically.
    Path travels lower-left → upper-right so the plane tilts nose-up. Correct.
  -->
  <g>
    <animateMotion
      dur="5s"
      repeatCount="indefinite"
      rotate="auto"
      calcMode="spline"
      keyTimes="0;1"
      keySplines="0.37 0 0.63 1">
      <mpath href="#fp"/>
    </animateMotion>

    <!-- Fuselage -->
    <path d="M -40,0
             C -30,-4.8 -6,-5.8 18,-3.4
             L 33,-2.1 C 37,-1.1 39,0 37,1.3
             L 31,2.3 C -6,5.8 -30,4.8 -40,0 Z"
          fill="white"/>

    <!-- Nose cone (tapers to a point) -->
    <path d="M 31,-2.1 C 41,-1.3 48,0 41,2.1 L 31,2.3 Z"
          fill="white"/>

    <!-- Port wing (above fuselage in local frame) -->
    <path d="M 7,-3.2
             C 4,-14 -5,-29 -9,-35
             L -15,-32
             C -11,-26 -2,-12 0,-2.2 Z"
          fill="rgba(255,255,255,0.90)"/>

    <!-- Starboard wing -->
    <path d="M 7,3.2
             C 4,14 -5,29 -9,35
             L -15,32
             C -11,26 -2,12 0,2.2 Z"
          fill="rgba(255,255,255,0.90)"/>

    <!-- Port horizontal stabiliser -->
    <path d="M -28,-2.2
             C -31,-9 -35,-18 -36,-18
             L -32,-17
             C -32,-16 -29,-9 -26,-2.2 Z"
          fill="rgba(255,255,255,0.80)"/>

    <!-- Starboard horizontal stabiliser -->
    <path d="M -28,2.2
             C -31,9 -35,18 -36,18
             L -32,17
             C -32,16 -29,9 -26,2.2 Z"
          fill="rgba(255,255,255,0.80)"/>

    <!-- Vertical tail fin -->
    <path d="M -31,-1.2
             C -33,-7 -36,-17 -34,-19
             L -30,-16
             C -30,-14 -29,-7 -27,-1.2 Z"
          fill="rgba(255,255,255,0.76)"/>

    <!-- Port engine pod -->
    <ellipse cx="-2" cy="-23" rx="8.5" ry="2.8" fill="rgba(255,255,255,0.74)"/>

    <!-- Starboard engine pod -->
    <ellipse cx="-2" cy="23"  rx="8.5" ry="2.8" fill="rgba(255,255,255,0.74)"/>
  </g>

</svg>

<!-- ════════════════════════════════════════════
     LOADING UI OVERLAY (HTML)
════════════════════════════════════════════ -->
<div class="loading-ui">
  <p class="loading-primary">Finding your perfect destination</p>

  <div class="status-wrap">
    <span class="status-msg s1">Scanning hidden gems</span>
    <span class="status-msg s2">Analyzing flight routes</span>
    <span class="status-msg s3">Matching your travel style</span>
    <span class="status-msg s4">Discovering unforgettable places</span>
  </div>

  <div class="waypoints">
    <div class="wp wp1"></div>
    <div class="wp-dash"></div>
    <div class="wp wp2"></div>
    <div class="wp-dash"></div>
    <div class="wp wp3"></div>
  </div>
</div>

</div><!-- /#root -->
</body>
</html>
