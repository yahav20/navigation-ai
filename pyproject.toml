[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "unit: pure Python, no LLM or network (fast)",
    "integration: real LLM call, requires GROQ_API_KEY",
]
addopts = "--tb=short"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["E501", "ERA001", "D203", "D213", "T201"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "D100", "D101", "D102", "D103", "D104", "D401", "INP001", "PLR2004", "FBT001", "FBT002", "COM812", "PT011", "B017", "PLC0415", "RUF100"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"